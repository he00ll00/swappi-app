{% extends "core/base.html" %}{% load static %}
{% block body_class %}app{% endblock %}
{% block body %}
<aside class="sidebar">
  <a class="brand" href="{% url 'discover' %}"><img src="{% static 'core/img/logo.svg' %}" alt=""><span>Swappi</span></a>
  <nav>
    <a class="nav-link {% if active == 'discover' %}active{% endif %}" href="{% url 'discover' %}">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Discover</a>
    <a class="btn btn-primary nav-add" href="{% url 'create_listing' %}"><span>+</span> Add new listing</a>
    <a class="nav-link" href="#"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Offers &amp; meetups</a>
    <a class="nav-link" href="#" id="navTrade"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg>Trade matches</a>
    <a class="nav-link" href="#"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Activity</a>
  </nav>
</aside>
<div class="main">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search clothes, books, gadgets..." autocomplete="off">
    </label>
    <div class="top-actions">
      <button class="icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
      <button class="icon-btn" id="savedBtn" aria-label="Saved items"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg><i class="dot" id="savedDot" hidden></i></button>
      <div class="profile-menu">
        <button class="icon-btn" id="profileBtn" aria-label="Profile" aria-haspopup="true" aria-expanded="false" aria-controls="profileMenu"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
        <div class="profile-dropdown" id="profileMenu" hidden>
          <a class="profile-logout" href="{% url 'login' %}" id="logout">Log out</a>
        </div>
      </div>
    </div>
  </header>
  <main class="content">{% block content %}{% endblock %}</main>
</div>
<div class="scrim" id="scrim"></div>
{% endblock %}
